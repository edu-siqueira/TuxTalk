<div class="register-page">
  <div class="register-card">

    <div class="register-header">
      <img class='register-logo' src="tuxtalk-icon.png" alt="logo-tuxtalk" srcset="">
      <p class="register-title">Criar conta</p>
      <p class="register-subtitle">Bem-vindo ao tuxtalk</p>
    </div>

    <p-message
      *ngIf="erroCadastro"
      severity="error"
      [text]="erroCadastro"
      styleClass="register-error"
    ></p-message>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="field">
        <label for="username">Nome de usuário</label>
        <input
          id="username"
          type="text"
          pInputText
          formControlName="username"
          placeholder="tux"
          class="w-full"
        />
        <small class="field-error" *ngIf="username.invalid && username.touched">
          O nome de usuário deve ter pelo menos 3 caracteres.
        </small>
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="text"
          pInputText
          formControlName="email"
          placeholder="tux@tuxtalk.dev"
          class="w-full"
        />
        <small class="field-error" *ngIf="email.invalid && email.touched">
          Informe um email válido
        </small>
      </div>

      <div class="field">
        <label for="senha">Senha</label>
        <p-password
          inputId="senha"
          formControlName="senha"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="mínimo 8 caracteres"
          styleClass="w-full"
          inputStyleClass="w-full"
        ></p-password>
        <small class="field-error" *ngIf="senha.invalid && senha.touched">
          A senha deve ter ao menos 8 caracteres.
        </small>
      </div>

      <div class="field">
        <label for="confirmarSenha">Confirmar senha</label>
        <p-password
          inputId="confirmarSenha"
          formControlName="confirmarSenha"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="repita a senha"
          class="w-full"
        ></p-password>
        <small class="field-error" *ngIf="senhasDiferem">
          As senhas não coincidem.
        </small>
      </div>

      <label class="terms-check">
        <p-checkbox formControlName="aceitaTermos" [binary]="true"></p-checkbox>
        <span>Concordo com os <a routerLink="/termos">termos de uso</a></span>
      </label>

      <button
        pButton
        type="submit"
        label="Cadastrar"
        icon="pi pi-arrow-right"
        iconPos="right"
        [loading]="carregando"
        class="register-submit w-full"
      ></button>
    </form>

    <p-divider align="center">
      <span class="divider-text">Ou</span>
    </p-divider>

    <button
      pButton
      type="button"
      label="Continuar com Google"
      icon="pi pi-google"
      class="register-oauth w-full"
      (click)="onCadastroGoogle()"
    ></button>

    <button
      pButton
      type="button"
      label="Continuar com Github"
      icon="pi pi-github"
      class="register-oauth w-full"
      (click)="onCadastroGithub()"
    ></button>

    <p class="login-hint">
      Já tem conta? <a routerLink="/login">Entrar</a>
    </p>
  </div>
</div>
