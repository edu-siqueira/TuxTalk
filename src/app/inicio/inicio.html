<div class="landing-page">

  <nav class="landing-nav">
    <div class="brand">
      <span class="brand-name">TuxTalk</span>
    </div>
    <div class="nav-actions">
      <a routerLink="/categorias" class="nav-link">categorias</a>
      <a routerLink="/login" class="nav-link">entrar</a>
      <button type="button" class="btn-primary btn-sm" routerLink="/cadastro">criar conta</button>
    </div>
  </nav>

  <section class="hero">
    <img class="brand-logo" src="tuxtalk-icon.png" alt="icone TuxTalk" srcset="">
    <h1 class="hero-title">Onde a comunidade Linux<br />troca ideias de verdade.</h1>
    <p class="hero-subtitle">dúvidas, dotfiles, distros e discussões: sem ruído, sem enrolação.</p>
    <div class="hero-actions">
      <button type="button" class="btn-primary" routerLink="/cadastro">criar conta →</button>
      <button type="button" class="btn-outline" routerLink="/feed">ver posts</button>
    </div>
  </section>

  <section class="destaques">
    <div class="destaque-card" *ngFor="let destaque of destaques">
      <i [class]="destaque.icone" aria-hidden="true"></i>
      <p class="destaque-titulo">{{ destaque.titulo }}</p>
      <p class="destaque-descricao">{{ destaque.descricao }}</p>
    </div>
  </section>

  <p class="landing-footer">Projeto de <a href="https://github.com/edu-siqueira" target="_blank">Eduardo Siqueira</a>.</p>
  <p class="landing-footer">feito por um usuário Linux, para usuários linux.</p>

</div>
